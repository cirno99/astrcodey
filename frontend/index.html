<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AstrCode</title>
    <!-- 正文 ASCII 部分用 Inter；提前拉取可避免 font-display: swap 造成的文字闪动与重排。 -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/src/assets/fonts/inter-latin.woff2"
    />
    <script>
      ;(function () {
        var stored = localStorage.getItem('astrocode-theme')
        var pref =
          stored === 'light' || stored === 'dark' || stored === 'system'
            ? stored
            : 'system'
        var dark =
          pref === 'dark' ||
          (pref === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
