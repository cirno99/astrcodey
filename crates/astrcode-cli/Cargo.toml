[package]
name = "astrcode-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI entry point: exec, server, and ACP commands"
default-run = "astrcode"

[[bin]]
name = "astrcode"
path = "src/main.rs"

[features]
dev-mode = ["dep:astrcode-eval"]

[dependencies]
astrcode-server = { path = "../astrcode-server" }
astrcode-client = { path = "../astrcode-client" }
astrcode-core = { path = "../astrcode-core" }
astrcode-extension-sdk = { path = "../astrcode-extension-sdk" }
astrcode-protocol = { path = "../astrcode-protocol" }
astrcode-eval = { path = "../astrcode-eval", optional = true }
astrcode-log = { path = "../astrcode-log" }
tokio = { workspace = true, features = ["sync", "time", "rt-multi-thread", "macros"] }
serde_json = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "time", "rt-multi-thread", "macros"] }
