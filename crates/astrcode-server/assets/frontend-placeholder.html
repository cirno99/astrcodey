<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AstrCode · 前端未构建</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      main {
        max-width: 40rem;
        padding: 2rem;
        line-height: 1.7;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 1rem;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: color-mix(in srgb, CanvasText 10%, transparent);
        padding: 0.15rem 0.4rem;
        border-radius: 0.25rem;
      }
      p {
        margin: 0 0 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>前端产物未内嵌</h1>
      <p>
        当前二进制里是编译期写入的占位页，说明构建时
        <code>frontend/dist</code> 不存在。
      </p>
      <p>先构建前端，再重新编译服务端：</p>
      <p><code>cd frontend &amp;&amp; npm run build</code></p>
      <p><code>cargo build -p astrcode-server --bin astrcode-http-server</code></p>
      <p>HTTP API 本身不受影响，仍可通过 <code>/api</code> 正常访问。</p>
    </main>
  </body>
</html>
