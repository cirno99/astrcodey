[package]
name = "astrcode-extension-kanban"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bundled kanban board extension with requirement-driven automation"

[dependencies]
astrcode-extension-sdk = { path = "../astrcode-extension-sdk" }
async-trait = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# 集成测试要构造 HttpContext，需要 SDK 的 testing feature。
astrcode-extension-sdk = { path = "../astrcode-extension-sdk", features = ["testing"] }
tempfile = { workspace = true }
